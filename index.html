<!doctype html><html lang='en'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SinaaHub | UAE Manufacturing</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#14283e;font:16px/1.6 system-ui}header{background:#0b1f3a;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}button,a{cursor:pointer}button{border:0;border-radius:7px;padding:12px 20px;background:#008c91;color:white;font:inherit}nav{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1140px;margin:auto;padding:36px 20px}.hero{background:#0b1f3a;color:white;padding:65px 32px;border-radius:18px}.hero h1{font-size:clamp(32px,5vw,58px);line-height:1.12;max-width:850px}.hero p{max-width:650px;color:#c5d8e9}.gold{background:#e5b65a;color:#132740}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin:24px 0}.card{padding:24px;border-radius:12px;background:white;border:1px solid #e0e7ef}.notice{background:#fff1ce;padding:12px 20px;font-size:14px}h2{margin-top:32px}input,select,textarea{display:block;width:100%;font:inherit;padding:10px;margin:6px 0 16px;border:1px solid #bdcbd8;border-radius:6px}label{font-weight:600}table{width:100%;border-collapse:collapse}td,th{text-align:start;padding:12px;border-bottom:1px solid #ddd}.scroll{overflow:auto}footer{padding:32px;text-align:center}a{color:#007d83}.muted{color:#65798c}</style><header><strong>SinaaHub <small>UAE</small></strong><nav><button onclick='show(0)'>Home</button><button onclick='show(1)'>Buyer portal</button><button onclick='show(2)'>Suppliers</button><button onclick='show(3)'>Dashboard</button></nav></header><div class='notice'>Interactive concept demo — not a live procurement service. Supplier records are fictional. Entries stay in this browser only. Do not enter confidential drawings or personal information.</div><main id='view'></main><footer>SinaaHub · Working brand name · UAE / GCC manufacturing concept</footer><script>const $=x=>document.getElementById(x);let db;try{db=JSON.parse(localStorage.getItem('sinaa-preview'))}catch(e){}db=db||{rfqs:[],suppliers:[]};const processes=['CNC machining','Metal fabrication','Aluminium components','Casting and forging','Sheet metal','Coating and finishing'];const opts=processes.map(p=>'<option>'+p+'</option>').join('');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem('sinaa-preview',JSON.stringify(db))}catch(e){alert('Browser storage unavailable. Changes last for this session only.')}}function show(n){if(n===0){$('view').innerHTML=`<div class='hero'><p>MANAGED MANUFACTURING · UAE & GCC</p><h1>From industrial specification to delivered component.</h1><p>A proposed platform connecting industrial buyers with qualified manufacturing capacity. Source components, compare offers and coordinate quality and delivery in one place.</p><button class='gold' onclick='show(1)'>Start an RFQ</button> <button onclick='show(2)'>Register your capabilities</button></div><h2>One workflow. From sourcing to delivery.</h2><div class='grid'>${['01 · Define your requirement','02 · Match manufacturing capabilities','03 · Compare technical and commercial offers','04 · Coordinate production and inspection'].map(x=>`<div class='card'><h3>${x}</h3></div>`).join('')}</div><h2>Initial capability focus</h2><div class='grid'>${processes.map(x=>`<div class='card'>${x}</div>`).join('')}</div><div class='card'><h2>Built around industrial procurement</h2><p>Planned production features: supplier qualification, drawing control, normalized quotation comparisons, inspection records, milestone tracking and delivery documentation.</p><p class='muted'>These production features require a backend and operational team; they are not active services in this preview.</p></div>`}if(n===1){$('view').innerHTML=`<h1>Create a demo RFQ</h1><div class='card'><form id='rf'><label>Part description<input name='part' required maxlength='160'></label><label>Manufacturing process<select name='process'>${opts}</select></label><label>Material / specification<input name='material' maxlength='160'></label><label>Quantity<input name='qty' type='number' min='1' max='10000000' required></label><label>Delivery location<select name='city'><option>Dubai</option><option>Abu Dhabi</option><option>Sharjah</option><option>Ras Al Khaimah</option><option>Other UAE / GCC</option></select></label><button>Save demo RFQ</button><p class='muted'>No request will be sent to suppliers. File uploads and quotation processing are not enabled.</p></form></div>`;$('rf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.rfqs.push({...f,id:'DEMO-'+(db.rfqs.length+1),status:'Draft — demo only'});save();show(3)}}if(n===2){$('view').innerHTML=`<h1>Supplier capability registration</h1><div class='card'><form id='sf'><label>Demo company name<input name='company' required maxlength='120'></label><label>Location<input name='location' required maxlength='120'></label><label>Primary capability<select name='process'>${opts}</select></label><label>Certifications (unverified)<input name='cert' maxlength='160'></label><button>Save demo supplier</button></form></div><h2>Example supplier network</h2><div class='grid'>${['Example CNC workshop · Dubai','Example fabrication company · Sharjah','Example aluminium processor · Abu Dhabi'].map(x=>`<div class='card'>${x}<p class='muted'>Fictional illustration — not verified</p></div>`).join('')}</div>`;$('sf').onsubmit=e=>{e.preventDefault();db.suppliers.push(Object.fromEntries(new FormData(e.target)));save();show(3)}}if(n===3){$('view').innerHTML=`<h1>Demo workspace</h1><div class='grid'><div class='card'><h2>${db.rfqs.length}</h2>Saved demo RFQs</div><div class='card'><h2>${db.suppliers.length}</h2>Unverified demo supplier entries</div><div class='card'><h2>AED</h2>Planned quotation currency</div></div><h2>Your RFQs</h2><div class='card scroll'><table><tr><th>ID</th><th>Part</th><th>Process</th><th>Quantity</th><th>Destination</th><th>Status</th></tr>${db.rfqs.map(r=>`<tr>${[r.id,r.part,r.process,r.qty,r.city,r.status].map(v=>'<td>'+esc(v)+'</td>').join('')}</tr>`).join('')}</table>${db.rfqs.length?'':'<p>No RFQs yet. Create one in the buyer portal.</p>'}</div><h2>Your supplier entries</h2><div class='grid'>${db.suppliers.map(s=>`<div class='card'><h3>${esc(s.company)}</h3><p>${esc(s.location)} · ${esc(s.process)}</p><p>Certifications (unverified): ${esc(s.cert||'None entered')}</p></div>`).join('')}</div><p class='muted'>No shared database, authentication, payments or live supplier verification. This browser stores only demo entries.</p>`}}show(0);</script></html>
